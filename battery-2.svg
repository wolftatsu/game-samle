<svg xmlns="http://www.w3.org/2000/svg" width="200" height="400" viewBox="0 0 200 400">
  <defs>
    <!-- キャビネット背景グラデーション -->
    <linearGradient id="cabinetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e5e7eb"/>
    </linearGradient>
    <!-- モジュールベイ背景 -->
    <linearGradient id="bayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <!-- 緑エネルギーグラデーション -->
    <linearGradient id="energyGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#064e3b"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <!-- LED緑グロー -->
    <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- エネルギーグロー -->
    <filter id="energyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- キャビネット外枠 -->
  <rect x="3" y="3" width="194" height="394" rx="8" ry="8"
        fill="url(#cabinetGrad)" stroke="#4b5563" stroke-width="3"/>

  <!-- LEDグループ (右上) - 満タンなので全て緑 -->
  <g transform="translate(165, 12)">
    <circle cx="0" cy="0" r="3" fill="#10b981" filter="url(#greenGlow)"/>
    <circle cx="10" cy="0" r="3" fill="#10b981" filter="url(#greenGlow)"/>
    <circle cx="20" cy="0" r="3" fill="#10b981" filter="url(#greenGlow)"/>
  </g>

  <!-- 冷却パネル -->
  <g transform="translate(13, 13)">
    <rect width="60" height="374" fill="rgba(0,0,0,0.05)"/>

    <!-- ベント (18本) -->
    <g transform="translate(6, 30)">
      <rect x="0" y="0" width="48" height="3" rx="1" fill="#4b5563" opacity="0.6"/>
      <rect x="0" y="18" width="48" height="3" rx="1" fill="#4b5563" opacity="0.6"/>
      <rect x="0" y="36" width="48" height="3" rx="1" fill="#4b5563" opacity="0.6"/>
      <rect x="0" y="54" width="48" height="3" rx="1" fill="#4b5563" opacity="0.6"/>
      <rect x="0" y="72" width="48" height="3" rx="1" fill="#4b5563" opacity="0.6"/>
      <rect x="0" y="90" width="48" height="3" rx="1" fill="#4b5563" opacity="0.6"/>
      <rect x="0" y="108" width="48" height="3" rx="1" fill="#4b5563" opacity="0.6"/>
      <rect x="0" y="126" width="48" height="3" rx="1" fill="#4b5563" opacity="0.6"/>
      <rect x="0" y="144" width="48" height="3" rx="1" fill="#4b5563" opacity="0.6"/>
      <rect x="0" y="162" width="48" height="3" rx="1" fill="#4b5563" opacity="0.6"/>
      <rect x="0" y="180" width="48" height="3" rx="1" fill="#4b5563" opacity="0.6"/>
      <rect x="0" y="198" width="48" height="3" rx="1" fill="#4b5563" opacity="0.6"/>
      <rect x="0" y="216" width="48" height="3" rx="1" fill="#4b5563" opacity="0.6"/>
      <rect x="0" y="234" width="48" height="3" rx="1" fill="#4b5563" opacity="0.6"/>
      <rect x="0" y="252" width="48" height="3" rx="1" fill="#4b5563" opacity="0.6"/>
      <rect x="0" y="270" width="48" height="3" rx="1" fill="#4b5563" opacity="0.6"/>
      <rect x="0" y="288" width="48" height="3" rx="1" fill="#4b5563" opacity="0.6"/>
      <rect x="0" y="306" width="48" height="3" rx="1" fill="#4b5563" opacity="0.6"/>
    </g>

    <!-- Cooling テキスト -->
    <text x="30" y="360" font-family="sans-serif" font-size="8" fill="#6b7280"
          text-anchor="middle" font-weight="bold">COOLING</text>
  </g>

  <!-- 仕切り線 -->
  <line x1="74" y1="13" x2="74" y2="387" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>

  <!-- バッテリーモジュールベイ -->
  <g transform="translate(78, 13)">
    <rect width="109" height="374" rx="4" ry="4" fill="url(#bayGrad)" stroke="#4b5563" stroke-width="2"/>

    <!-- モジュール7個 (下から上に配置) -->
    <!-- モジュール1 (一番下) -->
    <g transform="translate(4, 324)">
      <rect width="101" height="42" rx="2" ry="2" fill="#111827" stroke="#374151" stroke-width="1"/>
      <rect x="1" y="1" width="99" height="40" rx="1" ry="1" fill="url(#energyGreen)" filter="url(#energyGlow)"/>
    </g>

    <!-- モジュール2 -->
    <g transform="translate(4, 276)">
      <rect width="101" height="42" rx="2" ry="2" fill="#111827" stroke="#374151" stroke-width="1"/>
      <rect x="1" y="1" width="99" height="40" rx="1" ry="1" fill="url(#energyGreen)" filter="url(#energyGlow)"/>
    </g>

    <!-- モジュール3 -->
    <g transform="translate(4, 228)">
      <rect width="101" height="42" rx="2" ry="2" fill="#111827" stroke="#374151" stroke-width="1"/>
      <rect x="1" y="1" width="99" height="40" rx="1" ry="1" fill="url(#energyGreen)" filter="url(#energyGlow)"/>
    </g>

    <!-- モジュール4 -->
    <g transform="translate(4, 180)">
      <rect width="101" height="42" rx="2" ry="2" fill="#111827" stroke="#374151" stroke-width="1"/>
      <rect x="1" y="1" width="99" height="40" rx="1" ry="1" fill="url(#energyGreen)" filter="url(#energyGlow)"/>
    </g>

    <!-- モジュール5 -->
    <g transform="translate(4, 132)">
      <rect width="101" height="42" rx="2" ry="2" fill="#111827" stroke="#374151" stroke-width="1"/>
      <rect x="1" y="1" width="99" height="40" rx="1" ry="1" fill="url(#energyGreen)" filter="url(#energyGlow)"/>
    </g>

    <!-- モジュール6 -->
    <g transform="translate(4, 84)">
      <rect width="101" height="42" rx="2" ry="2" fill="#111827" stroke="#374151" stroke-width="1"/>
      <rect x="1" y="1" width="99" height="40" rx="1" ry="1" fill="url(#energyGreen)" filter="url(#energyGlow)"/>
    </g>

    <!-- モジュール7 (一番上) -->
    <g transform="translate(4, 36)">
      <rect width="101" height="42" rx="2" ry="2" fill="#111827" stroke="#374151" stroke-width="1"/>
      <rect x="1" y="1" width="99" height="40" rx="1" ry="1" fill="url(#energyGreen)" filter="url(#energyGlow)"/>
    </g>
  </g>
</svg>
