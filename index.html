<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>あったらいいな運動会2026春 蓄電池チャージゲーム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1 class="title">あったらいいな運動会2026春<br><span class="title-sub">蓄電池チャージゲーム</span></h1>

        <!-- 蓄電池表示エリア -->
        <div class="battery-container">
            <div class="bss-wrapper">
                <!-- パーセンテージ表示 -->
                <div class="percentage-display" id="batteryPercentage">0%</div>

                <!-- キャビネット本体 -->
                <div class="bss-container">
                    <!-- ステータスライト -->
                    <div class="led-group">
                        <div class="led" id="led1"></div>
                        <div class="led" id="led2"></div>
                        <div class="led" id="led3"></div>
                    </div>

                    <!-- ロゴ -->
                    <div class="battery-logo">
                        <img src="LOVE Battery_T.png" alt="LOVE Battery">
                    </div>

                    <!-- 冷却パネル -->
                    <div class="cooling-panel">
                        <div class="vent"></div>
                        <div class="vent"></div>
                        <div class="vent"></div>
                        <div class="vent"></div>
                        <div class="vent"></div>
                        <div class="vent"></div>
                        <div class="vent"></div>
                        <div class="vent"></div>
                        <div class="vent"></div>
                        <div class="vent"></div>
                        <div class="vent"></div>
                        <div class="vent"></div>
                        <div class="vent"></div>
                        <div class="vent"></div>
                        <div class="vent"></div>
                        <div class="vent"></div>
                        <div class="vent"></div>
                        <div class="vent"></div>
                        <div class="vent"></div>
                        <div class="vent"></div>
                        <div class="text-[8px] text-gray-500 mt-2 font-bold uppercase">Cooling</div>
                    </div>

                    <!-- バッテリーモジュールベイ -->
                    <div class="module-bay" id="moduleBay">
                        <div class="battery-module"><div class="module-fill" id="module1"></div></div>
                        <div class="battery-module"><div class="module-fill" id="module2"></div></div>
                        <div class="battery-module"><div class="module-fill" id="module3"></div></div>
                        <div class="battery-module"><div class="module-fill" id="module4"></div></div>
                        <div class="battery-module"><div class="module-fill" id="module5"></div></div>
                        <div class="battery-module"><div class="module-fill" id="module6"></div></div>
                        <div class="battery-module"><div class="module-fill" id="module7"></div></div>
                        <div class="battery-module"><div class="module-fill" id="module8"></div></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ハートアニメーションエリア -->
        <div class="heart-area" id="heartArea"></div>

        <!-- タイマー表示 -->
        <div class="timer" id="timer">タイム: 0.00秒</div>

        <!-- ゲーム画面 -->
        <div class="game-screen" id="gameScreen">
            <!-- 名前入力画面 -->
            <div class="screen name-screen" id="nameScreen">
                <p class="instruction">プレイヤー名を入力してください</p>
                <input type="text" class="name-input" id="playerNameInput" placeholder="名前を入力..." maxlength="12">
                <p class="name-hint">※空欄の場合はゲスト名が自動生成されます</p>
                <button class="btn start-btn" id="nameSubmitBtn">Start</button>
            </div>

            <!-- スタート画面 -->
            <div class="screen start-screen hidden" id="startScreen">
                <p class="player-name-display" id="playerNameDisplay"></p>
                <p class="instruction">ボタンを連打して<br>蓄電池を満タンにしよう！</p>
                <button class="btn start-btn" id="startBtn">ゲームスタート</button>
            </div>

            <!-- カウントダウン画面 -->
            <div class="screen countdown-screen hidden" id="countdownScreen">
                <div class="countdown-number" id="countdownNumber">3</div>
            </div>

            <!-- プレイ画面 -->
            <div class="screen play-screen hidden" id="playScreen">
                <p class="player-name-display" id="playPlayerNameDisplay"></p>
                <button class="btn charge-btn" id="chargeBtn">
                    <span class="charge-text">充電！</span>
                    <span class="charge-icon">⚡</span>
                </button>
            </div>

            <!-- 結果画面 -->
            <div class="screen result-screen hidden" id="resultScreen">
                <div class="result-content">
                    <h2 class="result-title">満タン達成！</h2>
                    <div class="result-player" id="resultPlayer"></div>
                    <div class="result-time" id="resultTime">00.00秒</div>

                    <!-- ランキング表示 -->
                    <div class="ranking-section">
                        <h3 class="ranking-title">Top 5 ランキング</h3>
                        <table class="ranking-table">
                            <thead>
                                <tr>
                                    <th>順位</th>
                                    <th>名前</th>
                                    <th>タイム</th>
                                </tr>
                            </thead>
                            <tbody id="rankingBody">
                            </tbody>
                        </table>
                    </div>

                    <button class="btn replay-btn" id="replayBtn">もう一度遊ぶ</button>
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
